# Tracebase on a single cloud server (AWS Lightsail / EC2, or any VPS): Tracebase + Caddy for automatic HTTPS.
#   cd deploy && cp .env.example .env   (or run setup.sh, which writes it)
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (ports 80/443). Tracebase itself listens on the internal network only.
name: tracebase

services:
  tracebase:
    build: ..
    restart: unless-stopped
    expose: ["8080"]
    volumes:
      - ${REPOS_DIR:-/srv/tracebase/repos}:/volume1/repos:ro   # the code to index, read-only
      - ${LOGS_DIR:-/srv/tracebase/logs}:/volume1/logs:ro      # log files to watch, read-only
      - tracebase-data:/data                                   # index + logs database (SQLite)
    environment:
      TRACEBASE_ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env (a public server must run in team mode)}"
      TRACEBASE_LLM_PROVIDER: ${LLM_PROVIDER:-none}             # none | ollama | openai (see README)
      TRACEBASE_LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      TRACEBASE_LLM_MODEL: ${LLM_MODEL:-llama3.1}
      TRACEBASE_ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      TRACEBASE_WATCH_INTERVAL: ${WATCH_INTERVAL:-300}
      # Privacy (see PRIVACY.md): encryption at rest, redaction of personal data in logs, retention
      TRACEBASE_DB_KEY: "${DB_KEY:-}"                           # empty = not encrypted (protect the disk instead)
      TRACEBASE_REDACT: ${REDACT:-1}
      TRACEBASE_REDACT_IPS: ${REDACT_IPS:-1}
      TRACEBASE_REDACT_EXTRA: ${REDACT_EXTRA:-}
      TRACEBASE_LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      TRACEBASE_ERROR_RETENTION_DAYS: ${ERROR_RETENTION_DAYS:-90}
      TRACEBASE_ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-90}
      TRACEBASE_AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    # no access log: URLs carry search terms and error ids; real client IPs come from Caddy
    command: ["uvicorn", "tracebase.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header",
              "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "*"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]   # only for the entrypoint's one-time chown
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional public demo: a separate Tracebase with only the demo data (demo/seed.py) and its own database, so a
  # public demo token can never see the real instance. Started by setup.sh --public-demo (compose profile "demo").
  tracebase-demo:
    build: ..
    profiles: ["demo"]
    restart: unless-stopped
    expose: ["8080"]
    volumes:
      - ../demo/volume1/repos:/volume1/repos:ro
      - ../demo/volume1/logs:/volume1/logs:ro
      - tracebase-demo-data:/data
    environment:
      TRACEBASE_ADMIN_TOKEN: "${DEMO_ADMIN_TOKEN:-}"
      TRACEBASE_LLM_PROVIDER: none
      TRACEBASE_WATCH_INTERVAL: 3600
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [tracebase]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in deploy/.env, e.g. tracebase-demo.duckdns.org}"
      DEMO_DOMAIN: "${DEMO_DOMAIN:-demo.localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # HTTPS certificates: keep this volume
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tracebase-data:
  tracebase-demo-data:
  caddy-data:
  caddy-config:
