[project]
name = "tracebase-cli"
version = "0.3.0"
description = "Find code you already wrote in your old projects and copy it into the one you are working on."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pathspec>=0.12",
    "mcp>=1.2",
]

[project.scripts]
tracebase = "tracebase_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracebase_cli"]
