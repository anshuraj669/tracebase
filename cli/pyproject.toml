[project]
name = "tracebase-cli"
version = "0.4.0"
description = "CLI and MCP server for Tracebase: find code you already wrote in your old projects, copy it into the current one, and explain production errors."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Anshu Raj" }]
keywords = ["mcp", "mcp-server", "code-search", "self-hosted", "claude-code", "ai-agent", "logs", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "httpx>=0.27",
    "pathspec>=0.12",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/anshuraj669/tracebase"
Repository = "https://github.com/anshuraj669/tracebase"
Issues = "https://github.com/anshuraj669/tracebase/issues"
Demo = "https://demo.tracebase.duckdns.org"

[project.scripts]
tracebase = "tracebase_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracebase_cli"]
